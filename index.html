<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maguje FC</title>
  <meta name="description" content="Official home of Maguje FC — fixtures, results, standings, news, and club information.">
  <meta property="og:title" content="Maguje FC">
  <meta property="og:description" content="Official home of Maguje FC — fixtures, results, standings, news, and club information.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://magujefc.netlify.app/assets/og-default.jpg">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1F6B3A">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="preconnect" href="https://pxtexddyvthgmietwhyc.supabase.co">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/view-transitions.css">
  <link rel="stylesheet" href="/css/crest-loader.css">
  <link rel="stylesheet" href="/css/skeleton.css">
  <link rel="stylesheet" href="/css/states.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/dashboard-shared.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="crest-loader" hidden></div>
  <header id="site-header"></header>
  <main id="app"></main>
  <footer id="site-footer"></footer>

  <!-- Admin dashboard shell — hidden by default, shown only for
       /maguje-dashboard/* routes (toggled in js/main.js). Wrapped in
       #dashboard-shell so every selector in dashboard-shared.css can
       be scoped to this subtree (`#dashboard-shell .card`, etc.) and
       never leak onto the public site's own markup — several of the
       dashboard's rules were bare element selectors (label, input,
       textarea, select) that would otherwise apply site-wide. -->
  <div id="dashboard-shell" class="hidden">
    <div id="app-sidebar-root"></div>
    <main id="main"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/dashboard/supabase-client.js"></script>
  <script src="/js/dashboard/media-pipeline.js"></script>
  <script src="/js/dashboard/scoreboard-core.js"></script>
  <script src="/js/dashboard/fab-scoreboard.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
